name: tagpr
on:
  push:
    branches: ["main"]
jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - uses: Songmu/tagpr@2afc990a4a5a9a340665cc1a484c2102f7de332f # v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
